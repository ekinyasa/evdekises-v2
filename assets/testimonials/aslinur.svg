<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" fill="none">
  <defs>
    <linearGradient id="bg-asl" x1="0" y1="0" x2="600" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="50%" stop-color="#EFE6DA"/>
      <stop offset="100%" stop-color="#E5D8C8"/>
    </linearGradient>
    <radialGradient id="bloom" cx="300" cy="187" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E47C3A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C07F53" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C07F53" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="375" fill="url(#bg-asl)"/>
  <!-- Ambient Radiance -->
  <circle cx="300" cy="190" r="140" fill="url(#bloom)" filter="url(#soft-blur)"/>
  <!-- Organic Floral / Weave Resonance Curves -->
  <g stroke="#A6734E" stroke-width="1.25" stroke-linecap="round" opacity="0.65">
    <!-- Center Core Stem -->
    <path d="M300 290 Q298 210 300 130 Q302 75 300 65"/>
    <!-- Organic Petal Arcs / Soundwaves -->
    <path d="M300 230 C240 215 210 160 250 115 C275 88 295 110 300 145" fill="none"/>
    <path d="M300 230 C360 215 390 160 350 115 C325 88 305 110 300 145" fill="none"/>
    <path d="M300 260 C210 245 170 170 230 110 C270 70 295 100 300 130" stroke-dasharray="2 3" opacity="0.5"/>
    <path d="M300 260 C390 245 430 170 370 110 C330 70 305 100 300 130" stroke-dasharray="2 3" opacity="0.5"/>
    <!-- Concentric Sound Weave -->
    <ellipse cx="300" cy="180" rx="90" ry="45" stroke="#C07F53" stroke-width="0.8" opacity="0.45"/>
    <ellipse cx="300" cy="180" rx="145" ry="72" stroke="#C07F53" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.35"/>
    <circle cx="300" cy="130" r="4.5" fill="#C07F53" opacity="0.85"/>
    <circle cx="250" cy="115" r="3" fill="#A6734E" opacity="0.7"/>
    <circle cx="350" cy="115" r="3" fill="#A6734E" opacity="0.7"/>
  </g>
  <!-- Subtle Typographic Monogram / Seed Marker -->
  <text x="300" y="335" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#8C6E56" opacity="0.75">RESONANCE · BOTANICAL WEAVE</text>
</svg>