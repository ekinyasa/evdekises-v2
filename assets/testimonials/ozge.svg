<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" fill="none">
  <defs>
    <linearGradient id="bg-ozg" x1="0" y1="0" x2="600" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2ECE4"/>
      <stop offset="50%" stop-color="#EBE3D7"/>
      <stop offset="100%" stop-color="#DDD2C3"/>
    </linearGradient>
    <radialGradient id="mirror-glow" cx="300" cy="187" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D7C5B0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DDD2C3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="375" fill="url(#bg-ozg)"/>
  <!-- Mirror / Aperture Center -->
  <circle cx="300" cy="187" r="110" fill="url(#mirror-glow)"/>
  <!-- Concentric Reflections & Clarity Horizons -->
  <g stroke="#96775B" stroke-linecap="round" opacity="0.6">
    <ellipse cx="300" cy="187" rx="100" ry="100" stroke-width="1.25"/>
    <ellipse cx="300" cy="187" rx="82" ry="82" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="160" y1="187" x2="440" y2="187" stroke-width="0.9" opacity="0.45"/>
    <!-- Vertical breath axis -->
    <line x1="300" y1="65" x2="300" y2="310" stroke-width="0.9" opacity="0.35" stroke-dasharray="3 4"/>
    <!-- Subtle mirror arc frames -->
    <path d="M220 187 C220 142 255 107 300 107" fill="none" stroke-width="1.2" stroke="#C07F53"/>
    <path d="M380 187 C380 232 345 267 300 267" fill="none" stroke-width="1.2" stroke="#C07F53"/>
  </g>
  <circle cx="300" cy="187" r="3.5" fill="#C07F53" opacity="0.9"/>
  <text x="300" y="335" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#8C6E56" opacity="0.75">CLARITY · HORIZON &amp; APERTURE</text>
